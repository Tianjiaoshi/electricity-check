name: Check Electricity

on:
  schedule:
    - cron: '0 0,12 * * *'   # 每天 UTC 0:00 和 12:00（北京时间 8:00 和 20:00）
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run electricity check script
        env:
          BASIC_AUTH: ${{ secrets.BASIC_AUTH }}
          SYNJONES_AUTH: ${{ secrets.SYNJONES_AUTH }}
          USER_ID: ${{ secrets.USER_ID }}
          TGC: ${{ secrets.TGC }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          ALARM_THRESHOLD: ${{ secrets.ALARM_THRESHOLD }}   # 可选，默认为10
          # 以下为可选，若硬编码在脚本中则无需设置
          FEE_ITEM_ID: ${{ secrets.FEE_ITEM_ID }}
          TYPE: ${{ secrets.TYPE }}
          LEVEL: ${{ secrets.LEVEL }}
          CAMPUS: ${{ secrets.CAMPUS }}
          BUILDING: ${{ secrets.BUILDING }}
          FLOOR: ${{ secrets.FLOOR }}
          ROOM: ${{ secrets.ROOM }}
        run: python scripts/check_electricity.py
