name: Check Electricity

on:
  schedule:
    - cron: '0 0,12 * * *'   # 每天 UTC 0:00 和 12:00（北京时间 8:00 和 20:00）
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run electricity check
        env:
          SYNJONES_AUTH_TOKEN: ${{ secrets.SYNJONES_AUTH_TOKEN }}
          REQUEST_COOKIE: ${{ secrets.REQUEST_COOKIE }}
          AUTHORIZATION: ${{ secrets.AUTHORIZATION }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NOTIFY_MODE: ${{ secrets.NOTIFY_MODE }}
          LOW_BALANCE_THRESHOLD: ${{ secrets.LOW_BALANCE_THRESHOLD }}
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
          # 单目标参数（如果未使用 TARGETS_JSON，会用到这些）
          CAMPUS: ${{ secrets.CAMPUS }}
          BUILDING: ${{ secrets.BUILDING }}
          FLOOR: ${{ secrets.FLOOR }}
          ROOM: ${{ secrets.ROOM }}
          FEEITEM_ID: ${{ secrets.FEEITEM_ID }}
          FEE_TYPE: ${{ secrets.FEE_TYPE }}
          FEE_LEVEL: ${{ secrets.FEE_LEVEL }}
          # 其他可选
          TARGET_QUERY_INTERVAL_SECONDS: ${{ secrets.TARGET_QUERY_INTERVAL_SECONDS }}
          NOTIFY_ON_ERROR: ${{ secrets.NOTIFY_ON_ERROR }}
        run: python scripts/check_electricity.py
